<form method="post" action="{% url 'customer_add' %}" class="form-member">
    {% csrf_token %}
    <div class="mb-2">
        <label for="member_id">Member ID: <span class="required-form">*</span></label>
        <input type="number" id="member_id" name="member_id" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="first_name">First Name: <span class="required-form">*</span></label>
        <input type="text" id="first_name" name="first_name" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="middle_name">Middle Name:</label>
        <input type="text" id="middle_name" name="middle_name" class="form-control">
    </div>
    <div class="mb-2">
        <label for="last_name">Last Name: <span class="required-form">*</span></label>
        <input type="text" id="last_name" name="last_name" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="citizenship_number">Citizenship Number: <span class="required-form">*</span></label>
        <input type="text" id="citizenship_number" name="citizenship_number" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="date_of_birth">Date of Birth: <span class="required-form">*</span></label>
        <input type="date" id="date_of_birth" name="date_of_birth" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="phone_number">Phone Number: <span class="required-form">*</span></label>
        <input type="text" id="phone_number" name="phone_number" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" class="form-control">
    </div>
    <div class="mb-2">
        <label for="address">Address: <span class="required-form">*</span></label>
        <input type="text" id="address" name="address" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="occupation">Occupation:</label>
        <input type="text" id="occupation" name="occupation" class="form-control">
    </div>
    <div class="mb-3 button-container">
        <button type="submit" class="btn btn-sm btn-primary">Add Member</button>
    </div>
</form>
<div class="button-container"><a href="{% url 'customer_home' %}" class="btn btn-danger">Back</a></div>
