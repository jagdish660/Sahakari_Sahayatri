{% extends "base.html" %}
{% load static %}

{% block title %}
Member Update : {{form.name}} 
{% endblock title %}

{% block content %}
<!-- <h2 class="mx-3">Update Member</h2> -->
<div class="form-div">
    <form method="post" action="{% url 'customer_update' id %}" class="form-member">
        <div class="text-center"><h2 class="p-3">Update Member :  {{form.name}}</h2></div>
        {% csrf_token %}
        <div class="mb-2">
            <label for="member_id">Member ID: </label> <span class="fw-bold">{{id}}</span>
        </div>
        <div class="mb-2">
            <label for="first_name">First Name: <span class="required-form" >*</span></label>
            <input type="text" id="first_name" name="first_name" value="{{form.first_name}}" class="form-control" required>
        </div>
        <div class="mb-2">
            <label for="middle_name">Middle Name:</label>
            <input type="text" id="middle_name" name="middle_name" value="{{form.middle_name}}" class="form-control">
        </div>
        <div class="mb-2">
            <label for="last_name">Last Name: <span class="required-form" >*</span></label>
            <input type="text" id="last_name" name="last_name" value="{{form.last_name}}" class="form-control" required>
        </div> 
        <div class="mb-2">
            <label for="date_of_birth">Date of Birth: <span class="required-form" >*</span></label>
            <input type="date" id="date_of_birth" name="date_of_birth" value="{{ form.date_of_birth|date:'Y-m-d' }}" class="form-control" required>
        </div>
        <div class="mb-2">
            <label for="address">Address: <span class="required-form" >*</span></label>
            <input type="text" id="address" name="address" value="{{form.address}}" class="form-control" required>
        </div>
        <div class="mb-2">
            <label for="phone_number">Phone Number: <span class="required-form" >*</span></label>
            <input type="text" id="phone_number" name="phone_number" value="{{form.phone_number}}" class="form-control" required>
        </div>  
        <div class="mb-2">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{form.email}}" class="form-control">
        </div>
        <div class="mb-2">
            <label for="occupation">Occupation:</label>
            <input type="text" id="occupation" name="occupation" value="{{form.occupation}}" class="form-control">
        </div>  
        <div class="mb-3 button-container">
            <button type="submit" class="more-btn btn-md btn-primary" value="submit">Update Member</button>
        </div> 
    </form>
</div>

<div class="button-container">
    <a href="{% url 'customer_home' %}" class="more-btn btn-danger btn-md btn">Back</a>
</div>

{% endblock content %}
