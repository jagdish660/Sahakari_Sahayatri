{% extends "base.html" %}
{% load static %}

{% block title %}
  Expenses
{% endblock title %}

{% block content %}
  <h1 class="mb-4 text-center text-primary">Expenses Add</h1>
<div class="form-div">
<form method="post" action="{% url 'expenses_add' %}" class="form-member">
    {% csrf_token %}
    <div class="mb-2">
        <label for="category">Expenses Category: <span class="required-form">*</span></label>
        <select name="category" id="category" class="form-control" required>
            <option value="" disabled selected>--Select Category--</option>
            <option id="stationary" value="stationary">Stationary</option>
            <option id="rent" value="rent">Rent</option>
            <option id="freight" value="freight">Freight</option>
            <option id="bonus" value="bonus">Bonus</option>
            <option id="printing" value="printing">Printing</option>
            <option id="photocopy" value="photocopy">Photocopy</option>
            <option id="fuel" value="fuel">Fuel</option>
            <option id="miscellaneous" value="miscellaneous">Miscellaneous</option>
        </select>
    </div>
    <div class="mb-2">
        <label for="amount">Amount: <span class="required-form">*</span></label>
        <input type="number" id="amount" name="amount" class="form-control" required>
    </div>
    <div class="mb-2">
        <label for="payment_method">Payment Method:</label>
        <select name="payment_method" id="payment_method" class="form-control">
            <option value="" disabled selected>--Select Payment Method--</option>
            <option value="cash">Cash</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="cheque">Cheque</option>
        </select>
    </div>
       
    <div class="mb-2">
        <label for="remarks">Remarks:</label>
        <input type="textarea" id="remarks" name="remarks" class="form-control">
    </div>
    <div class="mb-3 button-container">
        <button type="submit" class="btn btn-sm btn-primary">Add Expense</button>
    </div>
</form>
</div>  
<div class="button-container">
    <a href="{% url 'expenses_home' %}" class="btn btn-danger btn-lg">Back</a>
</div>




  {% endblock content %}
