{% extends "base.html" %}
{% load static %}

{% block title %}
Add Loan : {{member.name}}
{% endblock title %}

{% block content %}

<!-- <h2>Add Loan</h2>    -->

<div class="form-div">
    <form method="post" action="" class="form-member">
        <div class="text-center">
            <h2 class="p-3">Add Loan : {{member.name}}</h2>
        </div>
        {% csrf_token %}
        <label for="customer">Select Customer:</label>
        <div class="mb-2">
            <label for="id">Member ID:</label>
            <input type="text" name="id" id="id" value="{{member.member_id}}" disabled>
        </div>
        <div class="mb-2">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" value="{{member.name}}" disabled>
        </div>
        <div class="mb-2">
            <label for="Principal">Principal:</label>
            <input type="number" id="principal" name="principal" min="1000" step="0.01" class="form-control" required>
        </div>
        <div class="mb-2">
            <label for="rate">Interest Rate:</label>
            <input type="number" id="rate" name="rate" step="0.01" min="0" max="25" class="form-control" required>
        </div>
        <div class="mb-3 button-container">
            <button type="submit" class="btn btn-md btn-primary" value="submit">Add</button>
        </div>
    </form>
</div>
<div class="button-container">
    <a href="{% url 'customer_details' member.member_id %}" class="btn more-btn btn-md btn-danger">Back</a>
</div>
{% endblock content %}
