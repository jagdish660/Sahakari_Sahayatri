{% extends "base.html" %}
{% load static %}

{% block title %}
Add Loan
{% endblock title %}

{% block content %}


<div class="form-div">
    <form method="post" action="" class="form-login">
        <div class="text-center">
            <h2 class="p-3">Add Loan</h2>
        </div>
        {% csrf_token %}
        <label for="customer">Select Customer:</label>
        <select name="customer_id" id="customer" required>
            <option disabled selected hidden>Select Customer</option>
            {% for member in members %}
                <option value="{{ member.member_id }}">{{ member.member_id }} - {{ member.name }}</option>
            {% endfor %}
        </select><br><br>

        <div class="mb-2">
            <label for="Principal">Principal:</label>
            <input type="number" id="principal" name="principal" min="1000" step="0.01" class="form-control" required>
        </div>
        <div class="mb-2">
            <label for="rate">Interest Rate:</label>
            <input type="number" id="rate" name="rate" step="0.01" max="25" min="0" class="form-control" required>
        </div>
        <div class="mb-3 button-container">
            <button type="submit" class="btn btn-md btn-primary" value="submit">Add</button>
        </div>
    </form>
</div>
<div class="button-container">
    <a href="{% url 'loan_home' %}" class="btn more-btn btn-md btn-danger">Back</a>
</div>
{% endblock content %}
