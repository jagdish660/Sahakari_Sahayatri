{% extends "base.html" %}
{% load static %}

{% block title %}
Add Share for Member
{% endblock title %}

{% block content %}

<h2>Add Share for a Member</h2>   

<div class="form-div">
    <form method="post" class="form-member">
        {% csrf_token %}
        <div class="mb-2">
            <label for="member_id">Select Member:</label>
            <select name="member_id" id="member_id" class="form-control" required>
                <option value="" disabled selected>-- Select Member --</option>
                {% for member in members %}
                    <option value="{{ member.member_id }}">{{ member.name }} (ID: {{ member.member_id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-2">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" step="0.01" class="form-control" min="1000" required>
            <div class="form-text">Amount to purchase share</div>
        </div>

        <div class="mb-3 button-container">
            <button type="submit" class="btn btn-md btn-primary">Add</button>
        </div>
    </form>
</div>
<div class="button-container">
    <a href="{% url 'share_home' %}" class="btn-danger btn">Back</a>
</div>
{% endblock content %}
