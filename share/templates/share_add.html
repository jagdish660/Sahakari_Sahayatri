{% extends "base.html" %}
{% load static %}

{% block title %}
Add Share: {{member.name}}
{% endblock title %}

{% block content %}

<h2>Add Share for {{member.name}}</h2>   

<div class="form-div">
    <form method="post" action="" class="form-member">
        {% csrf_token %}
        <div class="mb-2">
            <label for="id">Member ID:</label>
            <input type="text" name="id" id="id" value="{{member.member_id}}" disabled>
        </div>
        <div class="mb-2">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" value="{{member.name}}" disabled>
        </div>
        <div class="mb-2">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" step="0.01" class="form-control" required>
            <div class="form-text">Amount to purshase share</div>
        </div>
        <div class="mb-3 button-container">
            <button type="submit" class="btn btn-md btn-primary" value="submit">Add</button>
        </div>
    </form>
</div>

{% endblock content %}
